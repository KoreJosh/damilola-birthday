<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#160b18">
<title>For Oluwadmilola — With Love</title>
<style>
:root{
  --bg:#090609; --cream:#f8f1e8; --gold:#d6a84f; --purple:#6f2468;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:white;font-family:Georgia,"Times New Roman",serif}
body{overflow:hidden}
#story{
  height:100svh;width:100%;overflow-y:auto;scroll-snap-type:y mandatory;
  scrollbar-width:none;overscroll-behavior-y:contain;
}
#story::-webkit-scrollbar{display:none}
.slide{
  position:relative;height:100svh;width:100%;scroll-snap-align:start;overflow:hidden;
  display:flex;align-items:center;justify-content:center;background:#0b080b;
}
.slide img{
  width:100%;height:100%;object-fit:contain;display:block;
}
.slide.photo img{object-fit:cover;filter:saturate(.98) contrast(1.02)}
.slide:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.24),transparent 18%,transparent 78%,rgba(0,0,0,.55));
}
.cover img{object-fit:contain}
.ui{
  position:fixed;z-index:20;inset:0;pointer-events:none;
}
.top{
  position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;
  display:flex;justify-content:space-between;align-items:center;
}
.brand{font-size:12px;letter-spacing:.28em;text-transform:uppercase;opacity:.78}
.music{
  pointer-events:auto;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.35);
  color:#fff;border-radius:999px;padding:10px 14px;backdrop-filter:blur(10px);
  font:12px Arial,sans-serif;letter-spacing:.06em;cursor:pointer
}
.bottom{
  position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:18px;right:18px;
  display:flex;align-items:flex-end;justify-content:space-between
}
.hint{font:11px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.counter{font:12px Arial,sans-serif;opacity:.7}
#gate{
  position:fixed;z-index:50;inset:0;background:
  radial-gradient(circle at 50% 35%,rgba(125,42,112,.45),transparent 38%),
  linear-gradient(145deg,#090609,#1c0c1b 55%,#090609);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;
}
.gate-inner{max-width:430px}
.crown{font-size:48px;margin-bottom:18px}
.kicker{font:11px Arial,sans-serif;letter-spacing:.38em;text-transform:uppercase;color:#d6a84f}
h1{font-size:clamp(42px,12vw,76px);font-weight:400;margin:12px 0 6px}
.subtitle{font-size:18px;font-style:italic;opacity:.82;margin-bottom:30px}
.begin{
  border:1px solid #d6a84f;color:#fff;background:rgba(214,168,79,.12);
  border-radius:999px;padding:15px 28px;font:12px Arial,sans-serif;
  letter-spacing:.18em;text-transform:uppercase;cursor:pointer
}
.note{font:11px Arial,sans-serif;opacity:.5;margin-top:18px;line-height:1.5}
#noaudio{display:none}
@media (min-width:700px){
  .slide{background:#111}
  .slide img{max-width:620px}
  .slide.photo img{max-width:none}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-inner">
    <div class="crown">♕</div>
    <div class="kicker">A little something for</div>
    <h1>Oluwadmilola</h1>
    <div class="subtitle">A year of light. A woman worth celebrating.</div>
    <button class="begin" id="begin">Tap to begin</button>
    <div class="note">For the full experience, turn your sound on.</div>
  </div>
</div>

<audio id="audio" loop preload="auto">
  <source src="ordinary-by-alex-warren.mp3" type="audio/mpeg">
</audio>

<div id="story" aria-label="Birthday story">
  <section class="slide cover"><img src="images/cover-start.png" alt="Happy Birthday Damilola"></section>

  <section class="slide"><img src="images/message-1.png" alt="A birthday message for Oluwadmilola"></section>
  <section class="slide"><img src="images/message-2.png" alt="A birthday message for Oluwadmilola"></section>
  <section class="slide"><img src="images/message-3.png" alt="A birthday message for Oluwadmilola"></section>
  <section class="slide"><img src="images/message-4.png" alt="A birthday message for Oluwadmilola"></section>

  <section class="slide photo"><img src="images/photo-1.jpg" alt="Oluwadmilola"></section>
  <section class="slide photo"><img src="images/photo-2.jpg" alt="Oluwadmilola"></section>
  <section class="slide photo"><img src="images/photo-4.png" alt="Oluwadmilola"></section>
  <section class="slide photo"><img src="images/photo-5.jpg" alt="Oluwadmilola"></section>
  <section class="slide photo"><img src="images/photo-3.jpg" alt="Oluwadmilola"></section>
  <section class="slide photo"><img src="images/photo-6.jpg" alt="Oluwadmilola"></section>
  <section class="slide photo"><img src="images/photo-7.jpg" alt="Oluwadmilola"></section>
  <section class="slide photo"><img src="images/photo-8.jpg" alt="Oluwadmilola"></section>

  <section class="slide cover"><img src="images/cover-start.png" alt="Happy Birthday Damilola — I love you always"></section>
</div>

<div class="ui">
  <div class="top">
    <div class="brand">For Oluwadmilola · With Love</div>
    <button class="music" id="music">♫ Music</button>
  </div>
  <div class="bottom">
    <div class="hint">Swipe / scroll</div>
    <div class="counter" id="counter">1 / 14</div>
  </div>
</div>

<script>
const gate=document.getElementById('gate');
const begin=document.getElementById('begin');
const audio=document.getElementById('audio');
const music=document.getElementById('music');
const story=document.getElementById('story');
const counter=document.getElementById('counter');
const slides=[...document.querySelectorAll('.slide')];

function playMusic(){
  audio.play().then(()=>{
    music.textContent='♫ Playing';
  }).catch(()=>{
    music.textContent='♫ Tap for music';
  });
}
begin.addEventListener('click',()=>{
  gate.style.display='none';
  playMusic();
});
music.addEventListener('click',()=>{
  if(audio.paused){playMusic()}else{audio.pause();music.textContent='♫ Paused'}
});

const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const i=slides.indexOf(e.target)+1;
      counter.textContent=`${i} / ${slides.length}`;
    }
  });
},{root:story,threshold:.65});
slides.forEach(s=>obs.observe(s));
</script>
</body>
</html>
